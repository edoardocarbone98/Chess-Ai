<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioca contro Edoardo Chess AI</title>
    
    <!-- Caricamento corretto del CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboardjs/1.0.0/chessboard.min.css" />

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #board {
            width: 400px;
            margin: 20px auto;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Gioca contro Edoardo Chess AI</h2>
    <div id="board"></div>
    <button onclick="resetGame()">Reset</button>

    <!-- Caricamento degli script nell'ordine corretto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboardjs/1.0.0/chessboard.min.js"></script>

    <script>
        var board;
        var game = new Chess();

        // Assicuriamoci che tutto venga caricato correttamente
        document.addEventListener("DOMContentLoaded", function() {
            board = Chessboard('board', {
                draggable: true,
                dropOffBoard: 'snapback'
            });
        });

        function resetGame() {
            game = new Chess();
            board.position(game.fen());
        }
    </script>
</body>
</html>
