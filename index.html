<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioca contro Edoardo Chess AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard.min.css" />
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #board {
            width: 400px;
            margin: 20px auto;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Gioca contro Edoardo Chess AI</h2>
    <div id="board"></div>
    <button onclick="resetGame()">Reset</button>
    
    <script>
        var board = Chessboard('board', {
            draggable: true,
            dropOffBoard: 'snapback',
            onDrop: handleMove
        });
        var game = new Chess();
        
        async function handleMove(source, target) {
            let move = source + target;
            if (game.move({ from: source, to: target }) === null) {
                return 'snapback';
            }
            board.position(game.fen());
            
            let response = await fetch("https://tuo-server.com/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ move: move })
            });
            
            let data = await response.json();
            if (data.ai_move) {
                game.move(data.ai_move);
                board.position(game.fen());
            }
        }

        async function resetGame() {
            let response = await fetch("https://tuo-server.com/reset");
            let data = await response.json();
            game = new Chess();
            board.position(game.fen());
        }
    </script>
</body>
</html>
